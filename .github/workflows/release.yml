# Releases a new version when mygo.json names one: builds the apps of
# every platform, signs their updates, and publishes them as a GitHub
# release, from which installed apps update themselves.
#
# To release: set "version" in mygo.json, describe it under a heading of
# its number in CHANGELOG.md, and push to main.
name: Release

on:
  push:
    branches: [main]
    paths: [mygo.json]
  workflow_dispatch:

permissions:
  contents: write # the release, and the uploads to it
  actions: write # starting the test of the install commands

concurrency: release

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
      release: ${{ steps.read.outputs.release }}
    steps:
      - uses: actions/checkout@v6
      - name: Read the version, and whether it is released
        id: read
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version mygo.json)
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2> /dev/null)" = "false" ]; then
            echo "Version $version is released already: nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          # The notes are the version's part of the changelog.
          notes=$(awk -v v="$version" '
            /^## / { on = ($2 == v || $2 == "[" v "]") ; next }
            on { print }' CHANGELOG.md)
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          # A draft, which the builds upload to, and which is published
          # once every platform is there.
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
              --title "Hermes Desktop $version" --notes "$notes"
          fi

  build:
    name: ${{ matrix.name }}
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # MyGo needs no cgo, so Ubuntu builds Windows' apps too; the
          # disk image of macOS needs a Mac.
          - { name: macOS, os: macos-latest, platform: "darwin/universal" }
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64,windows/arm64" }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64,linux/arm64" }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install NSIS, for the Windows installers
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Build
        env:
          # Signs the updates: installed apps take only what it signed.
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$MYGO_UPDATER_PRIVATE_KEY" ]; then
            echo "::error::The MYGO_UPDATER_PRIVATE_KEY secret is not set: the updates would be unsigned"
            exit 1
          fi
          go tool mygo build -platform "${{ matrix.platform }}"
      - name: Collect what to publish
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PLATFORM: ${{ matrix.name }}
        run: |
          # MyGo's names stay: install.ps1 finds the installer by its name
          # in SHA256SUMS, and the manifests name the archives.
          mkdir dist sums
          for dir in build/*/; do
            target=$(basename "$dir") # as windows-amd64
            for f in "$dir"*; do
              [ -f "$f" ] || continue
              name=$(basename "$f")
              case "$name" in
                update-*.json|*.tar.gz|*.delta|*.deb|*.dmg|*-setup-*.exe|install.sh|install.ps1) cp "$f" "dist/$name" ;;
                # The portable app, named for its platform.
                Hermes.exe) cp "$f" "dist/hermes-desktop-$VERSION-$target-portable.exe" ;;
              esac
            done
          done
          # Each job knows the sums of its own files; Publish joins them.
          cp build/SHA256SUMS "sums/SHA256SUMS-$PLATFORM"
          ls -la dist
          ls dist/update-*.json > /dev/null # signed updates must be among them
      - uses: actions/upload-artifact@v6
        with:
          name: Hermes-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: sums-${{ matrix.name }}
          path: sums/*
          if-no-files-found: error
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.version.outputs.tag }}" dist/* --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    name: Publish
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: sums-*
          merge-multiple: true
          path: sums
      - name: Join the checksums of every platform
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One line a file: install.sh is the same script on macOS and Linux.
          cat sums/SHA256SUMS-* | sort -k2 -u > SHA256SUMS
          cat SHA256SUMS
          grep -q -- '-setup-.*-amd64\.exe$' SHA256SUMS # install.ps1 needs the installer's line
          gh release upload "${{ needs.version.outputs.tag }}" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ needs.version.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --draft=false --latest
      - name: Try the install commands against it
        # A release made by a workflow starts no other workflow: this
        # one is asked for.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run install-test.yml --repo "$GITHUB_REPOSITORY" --ref main
